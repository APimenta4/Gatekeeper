# All tools are installed on the Docker image at build time based on the installation_command field
# The execution_command field is used when scanning and is used to generate the report file
# pip, curl and apt-get are available. If you need another package manager,
# you can include their own install command by chaining it (e.g. "apt-get install -y npm && npm install -g semgrep")
# or you can add it as a dependency to the base Dockerfile and then use it in the installation_command
generic_tools:
  - name: Semgrep
    installation_command: pip install semgrep
    execution_command: semgrep --config=auto --json --output {output_file}

  - name: Trivy
    installation_command: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin && trivy fs --download-db-only
    execution_command: trivy fs --format json --output {output_file} .

specific_tools:
  - name: Bandit
    supported_file_extensions: [.py]
    installation_command: pip install bandit
    execution_command: bandit -r . -f json -o {output_file}

  - name: gosec
    supported_file_extensions: [.go]
    installation_command: apt-get install -y gosec
    execution_command: gosec -fmt=json -out={output_file} ./...

  - name: ESLint
    supported_file_extensions: [.js, .ts, .jsx, .tsx]
    installation_command: >-
      npm install -g eslint eslint-plugin-security @typescript-eslint/parser
    execution_command: >-
      eslint --plugin security --format json --output-file {output_file}
      "**/*.{{js,ts,jsx,tsx}}" || true

  - name: Flawfinder
    supported_file_extensions: [.c, .cpp, .h]
    installation_command: pip install flawfinder
    execution_command: flawfinder --json --output {output_file} .

  - name: Progpilot
    supported_file_extensions: [.php]
    installation_command: >-
      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
      composer global require designsecurity/progpilot
    execution_command: ~/.composer/vendor/bin/progpilot --format json --output-file {output_file} . || true

  - name: SpotBugs
    supported_file_extensions: [.java]
    installation_command: >-
      mvn -q dependency:get -Dartifact=com.github.spotbugs:spotbugs-maven-plugin:4.8.6.4 || true
    execution_command: >-
      ([ -f pom.xml ] && mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs -q &&
      python3 -c "
      import xml.etree.ElementTree as ET, json
      root = ET.parse('target/spotbugsXml.xml').getroot()
      findings = [{'bugType': b.get('type'), 'class': (b.find('Class') or b).get('classname',''), 'priority': b.get('priority'), 'message': b.findtext('LongMessage','')} for b in root.findall('.//BugInstance')]
      json.dump(findings, open('{output_file}', 'w'))
      " || echo '[]' > {output_file}) || true

